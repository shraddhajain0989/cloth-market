# ═══════════════════════════════════════════════════════════
#  Render Deployment Configuration — cloth-market-api
#  Docs: https://render.com/docs/blueprint-spec
# ═══════════════════════════════════════════════════════════

services:
  - type: web
    name: cloth-market-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health

    envVars:
      # ── Server ──────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── Frontend URL (set to your Vercel domain after deploying) ──
      - key: CLIENT_URL
        value: https://your-app.vercel.app

      # ── Auth (Render auto-generates secure random values) ──
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── Fill these in Render dashboard → Environment ────
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
